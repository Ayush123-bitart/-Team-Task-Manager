<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Project Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Auth Screen -->
    <div id="auth-screen" class="auth-screen hidden">
      <div class="auth-brand">
        <div class="brand-logo">TF</div>
        <h1>TaskFlow</h1>
        <p>Manage projects. Assign tasks. Ship faster.</p>
      </div>
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Sign In</button>
          <button class="auth-tab" data-tab="signup">Sign Up</button>
        </div>
        <form id="login-form" class="auth-form">
          <div class="field">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="••••••••" required />
          </div>
          <div id="login-error" class="form-error hidden"></div>
          <button type="submit" class="btn-primary full-width">Sign In</button>
        </form>
        <form id="signup-form" class="auth-form hidden">
          <div class="field">
            <label>Full Name</label>
            <input type="text" id="signup-name" placeholder="Jane Smith" required />
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" id="signup-email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="signup-password" placeholder="Min. 6 characters" required />
          </div>
          <div id="signup-error" class="form-error hidden"></div>
          <button type="submit" class="btn-primary full-width">Create Account</button>
        </form>
      </div>
    </div>

    <!-- App Layout -->
    <div id="app-layout" class="app-layout hidden">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="brand-logo-sm">TF</div>
          <span class="brand-name">TaskFlow</span>
        </div>
        <nav class="sidebar-nav">
          <button class="nav-item active" data-view="dashboard">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Dashboard
          </button>
          <button class="nav-item" data-view="projects">
            <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
            Projects
          </button>
          <button class="nav-item" data-view="my-tasks">
            <svg viewBox="0 0 24 24"><path d="M9 11l3 3 5-5"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            My Tasks
          </button>
        </nav>
        <div class="sidebar-footer">
          <div class="user-chip">
            <div class="user-avatar" id="user-avatar"></div>
            <div class="user-info">
              <span id="user-name-sidebar"></span>
              <span id="user-email-sidebar"></span>
            </div>
          </div>
          <button id="logout-btn" class="btn-ghost" title="Sign out">
            <svg viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <div id="view-dashboard" class="view"></div>
        <div id="view-projects" class="view hidden"></div>
        <div id="view-my-tasks" class="view hidden"></div>
        <div id="view-project-detail" class="view hidden"></div>
      </main>
    </div>
  </div>

  <!-- Modals -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-box" class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="btn-ghost">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/projects.js"></script>
  <script src="/js/views/project-detail.js"></script>
  <script src="/js/views/my-tasks.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
